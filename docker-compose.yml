version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/unitedmess?replicaSet=rs0
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unitedmess-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - unitedmess-network

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          if (!db.hello().isWritablePrimary) {
            try { rs.status(); }
            catch (error) {
              if (error.code !== 94) throw error;
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            }
            quit(1);
          }'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - unitedmess-network

volumes:
  mongo-data:

networks:
  unitedmess-network:
    driver: bridge
